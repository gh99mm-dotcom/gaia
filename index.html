<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>별무리 개척단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic+Coding:wght@400;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: 3-column cockpit — pilot card | activity console | crew & comms. Single dark space look by choice. */
:root{
  --void:#06070d; --deep:#0b0d16; --panel:#11131e; --panel2:#181b29; --ink:#030409; --line:#232838;
  --text:#c4c7d4; --mute:#787d94; --dim:#4a4f64;
  --pink:#a8778c; --pinkd:#4f3240; --violet:#7a6fa0; --violetd:#2c2845; --cyan:#8aa9bd; --cyand:#2b4252;
  --gold:#bfae80; --green:#8ba790; --red:#a8626b;
  --f-display:"Do Hyeon","Nanum Gothic Coding",sans-serif;
  --f-body:"Nanum Gothic Coding",ui-monospace,monospace;
  --f-pix:"Silkscreen","Nanum Gothic Coding",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
body{background:var(--void);color:var(--text);font-family:var(--f-body);font-size:12.5px;line-height:1.55}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#stars{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 22px;display:flex;flex-direction:column;gap:12px}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.px{background:var(--panel);border:3px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line),3px 3px 0 var(--ink);}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.lbl{font-family:var(--f-pix);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo h1{font-size:21px;line-height:1;color:var(--text);text-shadow:2px 2px 0 var(--ink)}
.logo .lbl{margin-top:4px;display:block}
.adminchip{cursor:pointer;color:var(--gold);border-color:var(--ink)}
.adminchip+.chip{margin-left:0}
.renamef{display:flex;gap:6px;align-items:center;margin:2px 0}
.renamef input{width:150px}
.sugg{margin-left:auto;cursor:pointer;color:var(--cyan)}.sugg+.chip{margin-left:0}.sugg img{margin-right:-2px}
.bgm{margin-left:auto;cursor:pointer;color:var(--mute)}
.sugg+.bgm{margin-left:0}
.fbbadge{background:var(--red);color:var(--ink);padding:0 4px;margin-left:2px}
.suggta{background:var(--deep);color:var(--text);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:8px;font:inherit;font-size:14px;min-height:96px;resize:vertical}
.fblist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}.fbitem{background:var(--deep);border:2px solid var(--ink);padding:6px 8px;font-size:12px;display:flex;flex-direction:column;gap:3px}.fbitem .row{justify-content:space-between}.fbitem p{margin:0;white-space:pre-wrap;word-break:break-all}
.bgm[aria-pressed="true"]{color:var(--green)}
.bgm+.chip{margin-left:0}
.solobanner{display:flex;flex-direction:column;gap:4px;background:#1f1218;border:2px solid var(--red);padding:9px 12px;font-size:12px;line-height:1.6}
.solobanner>b{color:var(--red);font-family:var(--f-display);font-weight:400;font-size:15px}
.chip{margin-left:auto;display:flex;align-items:center;gap:8px;padding:4px 9px;background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-family:var(--f-pix);font-size:9px;letter-spacing:.08em}
.dot{width:8px;height:8px;background:var(--dim)}
.dot.on{background:var(--green);box-shadow:0 0 0 2px #26332a}
.dot.wait{background:var(--gold)}

/* grid */
.grid{display:grid;grid-template-columns:210px minmax(0,1fr) 270px;gap:12px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:200px minmax(0,1fr)}.side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr;gap:12px}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}.side{grid-template-columns:minmax(0,1fr)}}

/* pilot */
.vhead{height:36px;display:flex;align-items:flex-end;justify-content:center}
.vgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.vcard{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px;padding:6px 2px 5px;background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;color:var(--text);font:inherit}.vcard:hover{box-shadow:inset 0 0 0 1px var(--cyan)}.vav{position:relative;display:block}.vroom{position:absolute;right:-6px;bottom:-3px;background:var(--panel2);border:1px solid var(--ink);padding:1px;line-height:0}.von{position:absolute;left:-3px;top:-1px;width:5px;height:5px;background:var(--green);border:1px solid var(--ink)}.vnm{font-size:10px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leftcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.cook{padding:10px;display:flex;flex-direction:column;gap:8px}
.cook-h{display:flex;align-items:center;gap:8px}.cook-h .lbl{display:block;margin-top:2px}.cook-t{font-family:var(--f-display);font-size:15px}
.cookpot{display:inline-flex}.cookpot.on img{animation:cpot .5s steps(2) infinite}
@keyframes cpot{50%{transform:translateY(-1px)}}
.rtiles{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.rtile{position:relative;display:grid;place-items:center;aspect-ratio:1;padding:0;min-width:0;background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.rtile[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--gold);background:var(--panel2)}
.rtile.no img{opacity:.4;filter:grayscale(.7)}
.rtile.ok::after{content:'';position:absolute;right:2px;top:2px;width:3px;height:3px;background:var(--green)}
.csel,.cooking{display:flex;flex-direction:column;gap:6px;padding:8px}.csel b,.cooking b{font-size:12.5px}.csel .hint,.cooking .hint{font-size:10.5px;display:block}
.cneed{display:flex;flex-wrap:wrap;gap:3px}.cneed .ichip{font-size:10px;padding:1px 5px 1px 2px;gap:3px}.cneed .ichip.miss{color:var(--red)}.cneed .ichip b{font-weight:400;color:var(--mute)}.cneed .ichip.miss b{color:var(--red)}
.csel .btn,.cooking .btn{justify-content:center}.csel .btn[disabled]{opacity:.45;cursor:not-allowed}
.crow{display:flex;align-items:center;gap:8px}
.cbuff{display:flex;align-items:center;gap:6px;font-size:10.5px;background:var(--deep);border:2px solid var(--ink);padding:3px 6px;color:var(--gold)}.cbuff b{margin-left:auto;font-weight:400;color:var(--mute)}
.dlist{display:flex;flex-direction:column;gap:3px}.drow{display:flex;align-items:center;gap:5px;font-size:11px}.drow span{flex:1;min-width:0}.drow .btn{padding:2px 7px;font-size:11px}
.pilot{padding:12px;display:flex;flex-direction:column;gap:10px}
.pilot-top{display:flex;gap:12px;align-items:center}
.avatar{background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:3px}
.pilot-name{font-family:var(--f-display);font-size:17px;line-height:1.1;word-break:break-all}
.lv{font-family:var(--f-pix);font-size:9px;color:var(--gold);letter-spacing:.08em}
.stat{display:flex;flex-direction:column;gap:4px}
.stat-row{display:flex;align-items:center;gap:6px;justify-content:space-between;font-family:var(--f-pix);font-size:8.5px;letter-spacing:.08em}
.stat-row span:first-child{display:flex;align-items:center;gap:6px;color:var(--mute)}
.stat-row b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--text)}
.bar{height:9px;background:var(--ink);border:2px solid var(--ink);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;display:block;background:var(--c,var(--pink));transition:width .25s steps(6)}
.bar i::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(3,4,9,.6) 6px 8px)}
.bar i::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.12)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{background:var(--deep);border:2px solid var(--ink);padding:4px 7px}
.spec b{display:block;font-family:var(--f-pix);font-size:12px;font-weight:400;font-variant-numeric:tabular-nums}
.weapon{font-size:11px;color:var(--mute)}
.weapon strong{color:var(--cyan);font-weight:700}
.hint{font-size:10.5px;color:var(--dim);line-height:1.5}

/* console */
.console{display:flex;flex-direction:column;gap:12px;min-width:0}
.nav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
@media (max-width:620px){.nav{grid-template-columns:repeat(5,minmax(0,1fr))}}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 3px 6px;background:var(--panel);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 3px 0 var(--ink);cursor:pointer;position:relative;transition:transform .08s}
.nav button:hover{background:var(--panel2)}
.nav button:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px var(--line),0 1px 0 var(--ink)}
.nav button[aria-pressed="true"]{background:var(--violetd);box-shadow:inset 0 0 0 1px var(--cyan),0 3px 0 var(--ink)}
.nav .nm{font-family:var(--f-display);font-size:13px;line-height:1}
.nav .cost{font-family:var(--f-pix);font-size:8px;color:var(--gold);letter-spacing:.06em;min-height:11px}
.nav .badge{position:absolute;top:-6px;right:-6px;background:var(--pink);color:var(--ink);font-family:var(--f-pix);font-size:9px;padding:1px 4px;border:2px solid var(--ink)}

.stage{padding:14px;display:flex;flex-direction:column;gap:11px;min-height:270px}
.stage-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:3px dashed var(--line);padding-bottom:8px}
.stage-head h2{font-size:20px;line-height:1}
.loc{font-size:11px;color:var(--mute)}
.lead{color:var(--mute);max-width:62ch;margin:0}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:var(--pink);color:var(--ink);border:2px solid var(--ink);box-shadow:inset -2px -2px 0 var(--pinkd),0 3px 0 var(--ink);font-family:var(--f-display);font-size:14px;line-height:1;cursor:pointer;transition:transform .06s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:inset -2px -2px 0 var(--pinkd),0 1px 0 var(--ink)}
.btn small{font-family:var(--f-pix);font-size:8px;letter-spacing:.06em;opacity:.8}
.btn.alt{background:var(--cyan);box-shadow:inset -2px -2px 0 var(--cyand),0 3px 0 var(--ink)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:inset -2px -2px 0 var(--ink),0 3px 0 var(--ink)}
.btn.gold{background:var(--gold);box-shadow:inset -2px -2px 0 #5e5236,0 3px 0 var(--ink)}
.btn.sm{font-size:12.5px;padding:5px 9px}
.btn:disabled{background:var(--dim);color:var(--deep);cursor:not-allowed;box-shadow:0 3px 0 var(--ink);filter:none;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.card{background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:9px}
.result{display:flex;gap:12px;align-items:flex-start}
.result p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ichip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:2px solid var(--ink);padding:2px 7px 2px 3px;font-size:11px}
.ichip.minus{color:var(--red)}

/* farm */
.bay{flex:none;box-sizing:border-box;width:286px;height:296px;padding:20px 22px 34px;background:#1b1f2b center/100% 100% no-repeat;image-rendering:pixelated;position:relative}
.dome-label{position:absolute;left:0;right:0;bottom:11px;text-align:center;font-family:var(--f-pix);font-size:7px;letter-spacing:.2em;color:var(--mute)}
.farm-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.farm-top .farm-foot{flex:1;min-width:200px;grid-template-columns:minmax(0,1fr)}
.pods{display:grid;grid-template-columns:repeat(4,56px);gap:6px}
.ptile.lock{background:rgba(138,169,189,.03);border:1px dashed #1f2635;box-shadow:none;cursor:default}
.ptile.lock:hover{filter:none}
.ptile{width:56px;height:56px;flex:none;padding:0;border:0;background:transparent center/100% 100% no-repeat;image-rendering:pixelated;position:relative;cursor:pointer;display:block}
.ptile:hover{filter:brightness(1.3)}
.ptile[aria-pressed="true"]{filter:brightness(1.35) drop-shadow(0 0 0 var(--cyan));outline:1px dashed var(--cyan);outline-offset:1px}
.ptile .pn{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-family:var(--f-pix);font-size:6px;color:#05060b;line-height:1}
.ptile .tb{position:absolute;top:6px;right:7px}
.ptile .plant{position:absolute;left:50%;bottom:12px;transform:translateX(-50%)}
.ptile.lock{cursor:default}
.ptile.lock:hover{filter:none}
.ptile.add{outline:1px dashed #2a3342;outline-offset:-6px}
.ptile.add:hover{outline-color:var(--cyan)}
.ptile.add .plus{position:absolute;left:0;right:0;top:22px;text-align:center;font-family:var(--f-pix);font-size:14px;color:var(--mute)}
.podinfo{display:flex;flex-direction:column;gap:7px}
.podinfo h3{font-size:14px}
.podinfo .sub{font-size:11px;color:var(--mute)}
.pod-win.wet::after{background:#211e1f;box-shadow:0 -2px 0 var(--cyand)}
.pod-win.dirt::after{background:#3b332b}
.pod-win .tb{top:6px;right:6px}
.pod .acts{display:flex;flex-wrap:wrap;gap:5px}
.pod.add{align-items:center;justify-content:center;text-align:center;border-style:dashed;min-height:150px}
.farm-foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}
.pod{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.pod-win{height:84px;background:linear-gradient(var(--deep),#111725);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--cyand);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;position:relative}
.pod-win::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:7px;background:var(--violetd);border-top:2px solid var(--ink)}
.pod-win .pix{position:relative;z-index:1;margin-bottom:6px}
.pod h3{font-size:14px}
.pod .sub{font-size:11px;color:var(--mute)}
.seeds{display:flex;flex-direction:column;gap:6px}
.seedbtn{display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--panel2);border:2px solid var(--ink);cursor:pointer;text-align:left;font-size:12px}
.seedbtn:hover{background:var(--violetd)}
.seedbtn em{margin-left:auto;font-style:normal;font-family:var(--f-pix);font-size:10px;color:var(--gold)}

/* fish */
.lake{height:150px;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--cyand);background:#070b14;position:relative;overflow:hidden}
.lake canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.bob{position:absolute;left:42%;top:66%;transform:translate(-50%,-50%);z-index:1}
.bob.bite{animation:jerk .18s steps(2) infinite}
.bob-txt{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--f-display);font-size:15px;color:var(--text);text-shadow:1px 1px 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink);z-index:1}
.bob-txt.hot{color:var(--pink);text-shadow:2px 2px 0 var(--ink)}
@keyframes jerk{0%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-30%)}}
.fishrig{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:stretch}
@media (max-width:560px){.fishrig{grid-template-columns:minmax(0,1fr)}}
.dial-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:10px 12px}
.dial{position:relative;width:150px;height:80px}
.dial-face{position:absolute;inset:0;border-radius:75px 75px 0 0;border:2px solid var(--ink);border-bottom-width:3px;background:
 repeating-conic-gradient(from -90deg at 50% 100%,rgba(3,4,9,.85) 0 1deg,transparent 1deg 15deg),
 conic-gradient(from -90deg at 50% 100%,#1f2430 0deg calc(90deg - var(--z,9deg)),var(--green) calc(90deg - var(--z,9deg)) calc(90deg + var(--z,9deg)),#1f2430 calc(90deg + var(--z,9deg)) 180deg,transparent 180deg);box-shadow:inset 0 0 0 2px #2b3342}
.dial.live .dial-face{box-shadow:inset 0 0 0 2px var(--cyand)}
.needle{position:absolute;left:50%;bottom:0;width:4px;height:68px;background:var(--gold);border:1px solid var(--ink);transform-origin:50% 100%}
.hub{position:absolute;left:50%;bottom:-6px;width:14px;height:14px;transform:translateX(-50%);background:#5d6274;border:2px solid var(--ink)}
.castres{font-size:11px;color:var(--mute)}
.castres.good{color:var(--green)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;max-height:330px;overflow:auto;padding-right:2px}
.dexbox{display:flex;flex-direction:column;gap:8px;padding:0}
.dex-head{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:9px;cursor:pointer;text-align:left}
.dex-head b{font-family:var(--f-pix);font-weight:400;font-size:10px;color:var(--gold)}
.dex-head .caret{margin-left:auto;color:var(--mute)}
.dexbox .dtabs,.dexbox .dex{margin:0 9px}.dexbox .dex{margin-bottom:9px}
.dtabs{display:flex;gap:4px;flex-wrap:wrap}
.dtabs button{background:var(--panel2);border:2px solid var(--ink);padding:4px 9px;font-size:11.5px;cursor:pointer}
.dtabs button em{font-style:normal;font-family:var(--f-pix);font-size:8px;color:var(--gold)}
.dtabs button[aria-selected="true"]{background:var(--violetd);box-shadow:inset 0 0 0 1px var(--cyan)}
.dex div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;text-align:center;background:var(--deep);border:2px solid var(--ink);padding:8px 4px}
.ddex{grid-template-columns:repeat(auto-fill,minmax(64px,1fr));max-height:420px}.ddex div{padding:6px 3px;font-size:9.5px}
.srow .pix.no{filter:brightness(0) opacity(.35)}
.dex .no,.dex .pix.legend.no{filter:brightness(0) opacity(.35)!important;animation:none!important}

/* battle */
.arena{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:520px){.arena{grid-template-columns:minmax(0,1fr);justify-items:center}}
.foe{background:radial-gradient(circle at 50% 70%,#161b2b 0 40%,var(--deep) 41%);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:10px;display:flex;justify-content:center}
.foe .pix{animation:bob 2.4s steps(2) infinite;opacity:.92}
.foe.hit .pix{animation:shake .25s steps(3)}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes shake{33%{transform:translateX(-5px)}66%{transform:translateX(5px)}}
.blog{max-height:120px;overflow:auto;display:flex;flex-direction:column;gap:2px;font-size:11px}
.blog .me{color:var(--cyan)} .blog .them{color:var(--pink)} .blog .sys{color:var(--gold)}
.boss-name{font-size:19px;color:var(--pink);text-shadow:2px 2px 0 var(--ink)}
.ranks{display:flex;flex-direction:column;gap:3px;font-size:11px}
.ranks div{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;background:var(--deep);border:2px solid var(--ink)}
.ranks b{font-family:var(--f-pix);font-weight:400;font-size:11px;font-variant-numeric:tabular-nums}

/* gather */
.sites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:620px){.sites{grid-template-columns:repeat(2,minmax(0,1fr))}}
.site{display:flex;flex-direction:column;gap:3px;text-align:left;padding:6px 7px;background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;min-width:0}
.site:hover{background:var(--panel2)}
.site[aria-checked="true"]{background:var(--violetd);box-shadow:inset 0 0 0 1px var(--cyan)}

.field{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:9px;max-width:440px;width:100%;background:#0a0b10;border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 5px #17140f}
.tile{aspect-ratio:1;max-width:100%;border:0;padding:0;background-color:#1a1612;background-size:100% 100%;image-rendering:pixelated;cursor:pointer;position:relative;display:block}
.tile:hover{filter:brightness(1.3)}
.tile .plant{position:absolute;inset:0;width:100%;height:100%}
.tb{position:absolute;top:3px;right:3px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.farmer{position:absolute;transform:translate(-50%,-78%);transition:left .4s steps(5),top .4s steps(5);pointer-events:none;z-index:2;filter:drop-shadow(0 2px 0 rgba(0,0,0,.7))}
.tools{display:flex;flex-direction:column;gap:9px;min-width:0}
.toolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;background:var(--panel2);border:2px solid var(--ink);cursor:pointer;font-size:10.5px;min-width:0}
.tool:hover{background:var(--violetd)}
.tool em{font-style:normal;font-family:var(--f-pix);font-size:7px;color:var(--gold);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool[aria-pressed="true"]{background:var(--violetd);box-shadow:inset 0 0 0 1px var(--cyan)}
.seedbtn[aria-pressed="true"]{background:var(--violetd);box-shadow:inset 0 0 0 1px var(--cyan)}
.tank{display:flex;flex-direction:column;gap:6px;align-items:stretch}
b.no{color:var(--red)}
/* bag */
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px}
.slot{aspect-ratio:1;max-width:100%;background:var(--deep);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:0}
.slot:hover{box-shadow:inset 0 0 0 2px var(--violet)}
.slot[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--pink);background:var(--panel2)}
.slot em{position:absolute;right:3px;bottom:0;font-style:normal;font-family:var(--f-pix);font-size:8px;text-shadow:1px 1px 0 var(--ink)}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.cost-list{display:flex;flex-direction:column;gap:4px;font-size:11px}
.cost-list div{display:flex;align-items:center;gap:6px}
.cost-list .ok{color:var(--green)} .cost-list .no{color:var(--red)}
.cost-list b{margin-left:auto;font-family:var(--f-pix);font-weight:400;font-size:10px}

/* log */
.logbox{padding:10px 12px}
.logbox ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:120px;overflow:auto;font-size:11px}
.logbox li{display:flex;gap:10px}
.logbox time{font-family:var(--f-pix);font-size:10px;color:var(--dim);flex:none;padding-top:2px}
.logbox .good{color:var(--green)} .logbox .bad{color:var(--red)} .logbox .rare{color:var(--gold)}

/* side */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.crew{padding:11px;display:flex;flex-direction:column;gap:8px}
.crew ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto}
.crew li{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 6px;background:var(--deep);border:2px solid var(--ink)}
.crew li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crew li .act{margin-left:auto;font-size:11px;color:var(--mute);white-space:nowrap}
.crew li .lvt{font-family:var(--f-pix);font-size:9px;color:var(--gold)}
.comms{padding:11px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.feed{flex:1;min-height:210px;max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:5px;background:var(--ink);border:1px solid var(--line);padding:8px;font-size:12px}
.msg{word-break:break-word}
.msg .who{font-weight:700;margin-right:6px}
.msg time{font-family:var(--f-pix);font-size:9px;color:var(--dim);margin-right:6px}
.msg.sys{color:var(--gold);font-size:12px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0;background:var(--deep);color:var(--text);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:6px 8px;font:inherit}
.empty{color:var(--dim);font-size:12px;text-align:center;margin:auto}

/* modal + toast */
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:rgba(4,2,15,.82);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .px{max-width:360px;width:100%;padding:18px;display:flex;flex-direction:column;gap:11px}
.modal h2{font-size:21px}
.modal input{background:var(--deep);color:var(--text);border:2px solid var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:8px;font:inherit;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:6px 12px;font-family:var(--f-display);font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.note{font-size:12px;color:var(--mute);background:var(--deep);border:2px dashed var(--line);padding:8px 10px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.authgate{z-index:60}
.authgate .px{max-width:380px}
.authgate .dtabs button{flex:1}
.invcode{font-family:var(--f-pix);font-size:15px;letter-spacing:.12em;color:var(--gold)}
</style>

<script>
/* Firebase bridge: the game talks to window.claude.use(); here it resolves to Firebase-backed namespaces once the player signs in. */
window.__fb=new Promise(r=>window.__fbResolve=r);
window.claude={use:async n=>{const api=await window.__fb;return api[n]||null}};

<script type="module">

const firebaseConfig={
  apiKey:"AIzaSyAKGsc1iqpsOUcvy6uUybvBTz-zFFDpcIs",
  authDomain:"gaia-d0c35.firebaseapp.com",
  projectId:"gaia-d0c35",
  storageBucket:"gaia-d0c35.firebasestorage.app",
  messagingSenderId:"683810329861",
  appId:"1:683810329861:web:71f75b7e78dbc96afc536c",
  measurementId:"G-9Y2JG9SVWE"
};
/* PAD 이미지(Storage)를 쓰지 않으려면 false로 바꾸세요. */
const STORAGE_ON=true;
/* 로그인 아이디는 내부적으로 아이디@ID_DOMAIN 형태의 계정으로 저장돼요. 운영자 아이디와 함께 firestore.rules의 ADMIN 값도 바꿔야 해요. */
const ID_DOMAIN='nebula-outpost.app',ADMIN_ID='gh99mm';
const ID_RE=/^[a-z0-9_]{4,16}$/,idEmail=id=>id+'@'+ID_DOMAIN,normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const fs=initializeFirestore(app,{ignoreUndefinedProperties:true});
const st=STORAGE_ON?getStorage(app):null;
const EMU=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).has('emu');
if(EMU){connectAuthEmulator(auth,'http://127.0.0.1:9099',{disableWarnings:true});connectFirestoreEmulator(fs,'127.0.0.1',8080);if(st)connectStorageEmulator(st,'127.0.0.1',9199)}
const BUCKET=firebaseConfig.storageBucket;
window.__blobURL=id=>EMU?`http://127.0.0.1:9199/v0/b/${BUCKET}/o/${encodeURIComponent('pad/'+id)}?alt=media`:`https://firebasestorage.googleapis.com/v0/b/${BUCKET}/o/${encodeURIComponent('pad/'+id)}?alt=media`;

/* ---- error codes in the shape the game expects ---- */
const CODE={'permission-denied':'permission_denied','resource-exhausted':'quota_exceeded','invalid-argument':'invalid_argument','unavailable':'unavailable','unauthorized':'not_granted','unauthenticated':'not_granted','quota-exceeded':'quota_or_state','retry-limit-exceeded':'rate_limited'};
const wrapErr=e=>{const x=new Error(e&&e.message||'error');x.code=CODE[String(e&&e.code||'').replace(/^(firestore|storage)\//,'')]||'upstream_error';return x};
const W=p=>p.catch(e=>{throw wrapErr(e)});

/* ---- db: Firestore with the doc()/collection() surface the game uses ---- */
const ds=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
function makeDoc(path){const r=doc(fs,path);return{id:r.id,path,
  get:()=>W(getDoc(r)).then(ds),set:d=>W(setDoc(r,d)),update:d=>W(setDoc(r,d,{merge:true})),delete:()=>W(deleteDoc(r)),
  onSnapshot:(n,e)=>onSnapshot(r,s=>n(ds(s)),x=>e&&e(wrapErr(x))),collection:p=>makeQuery(path+'/'+p)}}
function makeQuery(path,w=[],o=null,l=0){
  const srvOrder=!!o&&w.every(x=>x[0]===o[0]);
  const build=()=>{const cs=w.map(([f,op,v])=>where(f,op,v));if(o&&srvOrder)cs.push(orderBy(o[0],o[1]||'asc'));if(l&&(srvOrder||!o))cs.push(limit(l));return query(collection(fs,path),...cs)};
  const shape=qs=>{let docs=qs.docs.map(d=>({id:d.id,data:()=>d.data()}));if(o&&!srvOrder){const [f,dir]=o,sg=dir==='desc'?-1:1;docs.sort((a,b)=>((a.data()[f]??0)>(b.data()[f]??0)?1:-1)*sg);if(l)docs=docs.slice(0,l)}return{docs,size:docs.length,empty:!docs.length}};
  return{where:(f,op,v)=>makeQuery(path,[...w,[f,op,v]],o,l),orderBy:(f,dir)=>makeQuery(path,w,[f,dir],l),limit:n=>makeQuery(path,w,o,n),
    doc:id=>makeDoc(path+'/'+(id||doc(collection(fs,path)).id)),
    add:async d=>{const r=await W(addDoc(collection(fs,path),d));return makeDoc(path+'/'+r.id)},
    get:()=>W(getDocs(build())).then(shape),onSnapshot:(n,e)=>onSnapshot(build(),qs=>n(shape(qs)),x=>e&&e(wrapErr(x)))}}
const db={doc:makeDoc,collection:p=>makeQuery(p)};

/* ---- room: presence + short-lived events, kept in Firestore ---- */
const ROOMS=new Set(),STALE=150e3;let ME=null;
function makeRoom(name){
  const peersC=collection(fs,'rooms',name,'peers'),evC=collection(fs,'rooms',name,'events'),me=doc(peersC,ME.uid);
  let state={},wT=null,lastW=0,peerFns=[],peerDocs=[],unE=null,handlers={},left=false;const seen=new Set(),joined=Date.now();
  const emitPeers=()=>{const now=Date.now(),peers=peerDocs.filter(d=>d.id===ME.uid||now-(d.ts||0)<STALE).map(d=>({id:d.id,presence:d.p||{},isMe:d.id===ME.uid}));peerFns.forEach(f=>{try{f({peers})}catch(e){console.error(e)}})};
  const flush=()=>{lastW=Date.now();return setDoc(me,{p:state,ts:Date.now()}).catch(()=>{})};
  const write=()=>{if(left)return;clearTimeout(wT);wT=setTimeout(flush,Math.max(0,1200-(Date.now()-lastW)))};
  const hb=setInterval(()=>{if(!left)flush()},60e3),tick=setInterval(emitPeers,30e3);
  const unP=onSnapshot(peersC,qs=>{peerDocs=qs.docs.map(d=>Object.assign({id:d.id},d.data()));emitPeers()},()=>{});
  const api={
    presence:async patch=>{for(const k in patch){if(patch[k]==null)delete state[k];else state[k]=patch[k]}write()},
    onPeers:fn=>{peerFns.push(fn);if(peerDocs.length)fn&&emitPeers();return()=>{peerFns=peerFns.filter(f=>f!==fn)}},
    emit:async(topic,data)=>{const r=await W(addDoc(evC,{t:topic,d:data??null,from:ME.uid,ts:Date.now()}));setTimeout(()=>deleteDoc(r).catch(()=>{}),20e3)},
    on:(topic,fn)=>{(handlers[topic]=handlers[topic]||[]).push(fn);
      if(!unE)unE=onSnapshot(query(evC,orderBy('ts','desc'),limit(40)),qs=>{qs.docChanges().forEach(ch=>{if(ch.type!=='added')return;const v=ch.doc.data();if(seen.has(ch.doc.id)||(v.ts||0)<joined-3000)return;seen.add(ch.doc.id);(handlers[v.t]||[]).forEach(h=>{try{h({topic:v.t,data:v.d,from:v.from})}catch(e){console.error(e)}})})},()=>{});
      return()=>{handlers[topic]=(handlers[topic]||[]).filter(f=>f!==fn)}},
    leave:async()=>{if(left)return;left=true;ROOMS.delete(api);clearTimeout(wT);clearInterval(hb);clearInterval(tick);unP();if(unE)unE();try{await deleteDoc(me)}catch(e){}}};
  ROOMS.add(api);return api}
addEventListener('pagehide',()=>ROOMS.forEach(r=>r.leave()));

/* ---- assets: PAD images in Cloud Storage ---- */
const ID_CH='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const newId=()=>Array.from(crypto.getRandomValues(new Uint8Array(20)),b=>ID_CH[b%62]).join('');
const assets=st?{
  upload:async(blob,o)=>{const id=newId(),type=(o&&o.type)||blob.type||'image/jpeg';await W(uploadBytes(sref(st,'pad/'+id),blob,{contentType:type,customMetadata:{owner:ME.uid}}));return{id,url:window.__blobURL(id),sizeBytes:blob.size,contentType:type}},
  delete:async id=>{try{await deleteObject(sref(st,'pad/'+id));return{deleted:true}}catch(e){if(e&&e.code==='storage/object-not-found')return{deleted:false};throw wrapErr(e)}},
  list:async()=>({assets:[],usage:{}})}:null;

/* ---- auth gate: ID login, invite-only sign-up ---- */
const $=s=>document.querySelector(s);let modeA='login',started=false,signupP=null;
const AUTH_MSG={'auth/email-already-in-use':'이미 쓰고 있는 아이디예요. 다른 아이디를 골라 주세요.','auth/weak-password':'비밀번호는 6자 이상이어야 해요.','auth/invalid-credential':'아이디 또는 비밀번호가 맞지 않아요.','auth/wrong-password':'아이디 또는 비밀번호가 맞지 않아요.','auth/user-not-found':'가입되지 않은 아이디예요.','auth/invalid-email':'아이디는 영문 소문자·숫자·_ 4~16자로 적어 주세요.','auth/too-many-requests':'시도가 너무 많아요. 잠시 뒤 다시 해 주세요.','auth/network-request-failed':'네트워크에 연결할 수 없어요.','auth/operation-not-allowed':'파이어베이스 콘솔에서 이메일/비밀번호 로그인을 켜 주세요.'};
const say=(m,bad)=>{const e=$('#authMsg');e.textContent=m||'';e.style.color=bad?'var(--red)':'var(--green)'};
function setMode(m){modeA=m;document.querySelectorAll('[data-auth]').forEach(b=>b.setAttribute('aria-selected',b.dataset.auth===m));const su=m==='signup';$('#authPw2').hidden=!su;$('#authNick').hidden=!su;$('#authCode').hidden=!su;$('#authGo').textContent=su?'초대장으로 가입하기':'로그인';$('#authPw').autocomplete=su?'new-password':'current-password';say('')}
document.querySelectorAll('[data-auth]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.auth)));
$('#authCode').addEventListener('input',e=>{const c=normCode(e.target.value).slice(0,8);e.target.value=c.length>4?c.slice(0,4)+'-'+c.slice(4):c});
async function signup(id,pw,nick,code){
  const admin=id===ADMIN_ID;
  if(!admin){if(code.length!==8)throw{msg:'초대코드 8자리를 적어 주세요.'};let ok=false;try{ok=(await getDoc(doc(fs,'invites',code))).exists()}catch(e){}if(!ok)throw{msg:'초대코드가 올바르지 않거나 이미 사용됐어요.'}}
  window.__fbNick=nick;const c=await createUserWithEmailAndPassword(auth,idEmail(id),pw);
  try{const bt=writeBatch(fs);bt.set(doc(fs,'members',c.user.uid),{id,code:admin?'':code,at:Date.now()});if(!admin)bt.delete(doc(fs,'invites',code));await bt.commit()}
  catch(e){try{await deleteUser(c.user)}catch(_){await signOut(auth)}throw{msg:'초대코드가 방금 다른 사람에게 사용됐어요. 운영자에게 새 초대장을 받아 주세요.'}}
  try{await updateProfile(c.user,{displayName:nick})}catch(e){}}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();const id=$('#authId').value.trim().toLowerCase(),pw=$('#authPw').value,btn=$('#authGo');
  if(!ID_RE.test(id)){say('아이디는 영문 소문자·숫자·_ 4~16자로 적어 주세요.',1);return}if(!pw){say('비밀번호를 적어 주세요.',1);return}
  btn.disabled=true;
  if(modeA==='signup'){const nk=$('#authNick').value.trim().slice(0,12),code=normCode($('#authCode').value);
    if(pw.length<6)say('비밀번호는 6자 이상이어야 해요.',1);else if(pw!==$('#authPw2').value)say('비밀번호 확인이 달라요.',1);else if(!nk)say('콜사인을 적어 주세요.',1);
    else{say('가입하는 중…');signupP=signup(id,pw,nk,code);try{await signupP}catch(x){say(x.msg||AUTH_MSG[x.code]||'가입하지 못했어요. ('+(x.code||'오류')+')',1)}signupP=null}}
  else{say('로그인하는 중…');try{await signInWithEmailAndPassword(auth,idEmail(id),pw)}catch(x){say(AUTH_MSG[x.code]||'로그인하지 못했어요. ('+(x.code||'오류')+')',1)}}
  btn.disabled=false});
window.__fbLogout=async()=>{await Promise.all([...ROOMS].map(r=>r.leave()));await signOut(auth);location.reload()};

onAuthStateChanged(auth,async u=>{
  if(!u){if(started){location.reload();return}$('#authGate').hidden=false;setTimeout(()=>$('#authId').focus(),50);return}
  if(started)return;
  if(signupP){try{await signupP}catch(e){return}}
  if(auth.currentUser!==u)return;
  const admin=u.email===idEmail(ADMIN_ID);
  let member=false;try{member=(await getDoc(doc(fs,'members',u.uid))).exists()}catch(e){}
  if(!member&&admin){try{await setDoc(doc(fs,'members',u.uid),{id:ADMIN_ID,code:'',at:Date.now()});member=true}catch(e){}}
  if(!member){$('#authGate').hidden=false;say('초대장으로 가입이 끝나지 않았거나 운영자가 내보낸 계정이에요. 운영자에게 초대장을 받아 다시 가입해 주세요.',1);await signOut(auth);return}
  $('#authGate').hidden=true;started=true;ME=u;if(!window.__fbNick)window.__fbNick=u.displayName||'';
  const lb=$('#logoutBtn');if(lb){lb.hidden=false;lb.title=(u.email||'').split('@')[0]}
  const lobby=Object.assign(makeRoom('lobby'),{join:async n=>makeRoom(String(n).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,80))});
  const user={id:async()=>u.uid,me:async()=>({id:u.uid,name:u.displayName||''}),isOwner:async()=>admin,canEdit:async()=>admin,can:async()=>true,profiles:async()=>({})};
  window.__fbInvite={mk:()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>A[x%32]).join('')}};
  window.__fbResolve({db,user,room:lobby,assets});
});

function DGF(k){const g=P.dg||{};let v=0;for(const sl in g){const it=dgById(g[sl]);if(it&&it.fx[k])v+=it.fx[k]}return v}
function dunDrop(f,chance,silent){if(Math.random()>=chance)return null;const pool=DGEAR.filter(g=>g.minF<=f&&!(P.own||[]).includes(g.id));if(!pool.length)return null;const g=pick(pool.map(x=>[x,Math.pow(1+DGEAR.indexOf(x)%5,2)]));P.own=[...(P.own||[]),g.id];log(`던전 전용 장비 발견! 「${g.n}」 (${DSLOT[g.slot]} · ${g.d}) — 던전 도감의 장비 탭에서 장착할 수 있다.`,'rare');sys(`${P.nick} 님이 던전에서 「${g.n}」을(를) 발견했어요!`);if(!silent)toast(`던전 장비 발견: ${g.n}`);sfxCoin();return g}

const maxHp=()=>60+P.lvl*12+(P.job==='guard'?20:0)+AS('vit')*8+GF('hp'), maxEn=()=>30+P.lvl*2+AS('end')*2+GF('en'), atk=()=>Math.round((6+P.lvl*2+P.wlv*5+AS('str')*2+GF('atk')+BUFF('atk'))*(P.job==='fighter'?1.15:1)), def=()=>Math.floor(P.lvl*1.5)+P.wlv+(SUITS[P.suit||0]||SUITS[0]).def+(P.job==='guard'?5:0)+GF('def')+BUFF('def'), need=l=>60*l+12*l*l;
function regen(){const now=Date.now();const st=Math.floor((now-P.t)/TICK);if(st>0){P.en=Math.min(maxEn(),P.en+st);P.hp=Math.min(maxHp(),P.hp+st*3);P.t+=st*TICK}if(P.en>=maxEn()&&P.hp>=maxHp())P.t=now}
function spend(n){regen();if(P.hp<=0){toast('체력이 바닥났어요. 음식을 먹거나 잠시 쉬세요.');return false}if(P.en<n){toast(`에너지가 부족해요 (필요 ${n})`);return false}P.en-=n;return true}
function add(id,n=1){P.inv[id]=(P.inv[id]||0)+n}
function take(id,n=1){if((P.inv[id]||0)<n)return false;P.inv[id]-=n;if(!P.inv[id])delete P.inv[id];return true}
const MAX_LV=100;
function gainXp(x){if(P.lvl>=MAX_LV){P.lvl=MAX_LV;P.xp=0;return}P.xp+=x;while(P.lvl<MAX_LV&&P.xp>=need(P.lvl)){P.xp-=need(P.lvl);P.lvl++;P.hp=maxHp();P.en=maxEn();log(`레벨 업! Lv.${P.lvl} — 체력과 에너지가 가득 찼다.`,'rare');sys(`${P.nick} 님이 Lv.${P.lvl}에 도달했어요.`)}if(P.lvl>=MAX_LV){P.lvl=MAX_LV;P.xp=0}}
function heal(hp,en){P.hp=Math.min(maxHp(),Math.max(0,P.hp+(hp||0)));P.en=Math.min(maxEn(),Math.max(0,P.en+(en||0)))}


/* cooking logic */
const FTIERS={c:['c','r','u','l'],r:['r','u','l'],u:['u','l']};
const FNAME={c:'아무 물고기',r:'레어 이상 물고기',u:'유니크 이상 물고기'};
function ingHave(id){if(id.startsWith('fish:'))return FTIERS[id.slice(5)].reduce((s2,tr)=>s2+FISHES[tr].reduce((a,f)=>a+(P.inv[f]||0),0),0);return P.inv[id]||0}
function ingTake(id,n){if(!id.startsWith('fish:'))return take(id,n);for(let k=0;k<n;k++){let got=false;for(const tr of FTIERS[id.slice(5)]){const f=FISHES[tr].filter(f2=>P.inv[f2]).sort((a,b)=>P.inv[b]-P.inv[a])[0];if(f){take(f);got=true;break}}if(!got)return false}return true}
function ingChip(id,n){const h=ingHave(id),ok=h>=n,nm=id.startsWith('fish:')?FNAME[id.slice(5)]:(ITEMS[id]?ITEMS[id].n:id),ic=id.startsWith('fish:')?iicon(FISHES[id.slice(5)][0],1):iicon(id,1);return`<span class="ichip ${ok?'':'miss'}">${ic}${nm} <b>${Math.min(h,99)}/${n}</b></span>`}
const canCook=c=>c.need.every(([id,n])=>ingHave(id)>=n);
function BUFF(k){const b=P.buff;if(!b||Date.now()>=b.until)return 0;return(b.fx&&b.fx[k])||0}
function applyDish(id){const c=COOK.find(x=>x.id===id);if(!c)return;if(c.xp)gainXp(c.xp);if(c.buff){P.buff={id,fx:Object.assign({},c.buff),until:Date.now()+c.bmin*60e3};log(`${c.n} 덕분에 힘이 솟는다. ${Object.entries(c.buff).map(([k,v])=>`${k==='atk'?'공격':'방어'} +${v}`).join(', ')} (${c.bmin}분)`,'rare')}}

function sfxSizzle(){if(!soundOn)return;const a=ac();if(!a)return;const t=a.currentTime;noiseBurst(a,t,.9,'highpass',2600,4200,.035);noiseBurst(a,t+.15,.6,'bandpass',5200,3400,.02);tone(a,'triangle',220,180,t,.12,.03)}
function sfxDing(){if(!soundOn)return;const a=ac();if(!a)return;const t=a.currentTime;tone(a,'sine',1318,0,t,.5,.07);tone(a,'sine',1760,0,t+.12,.6,.06);tone(a,'triangle',2637,0,t+.12,.25,.02)}
function renderCook(){const el=$('#cook');if(!el)return;const c=COOK.find(x=>x.id===cookSel)||COOK[0],ck=P.cook,cur=ck&&COOK.find(x=>x.id===ck.id),now=Date.now();
  const busy=!!cur,done=busy&&now>=ck.end,left=busy?Math.max(0,ck.end-now):0;
  const dishes=COOK.filter(x=>P.inv[x.id]);const bf=P.buff&&now<P.buff.until?P.buff:null;
  el.innerHTML=`<div class="cook-h"><span class="cookpot ${busy&&!done?'on':''}">${img(TPL.dPot,null,2)}</span><div style="min-width:0"><b class="cook-t">요리</b><span class="lbl">Galley · 조리실</span></div></div>
  ${bf?`<div class="cbuff">${iicon(bf.id,1)}<span>${Object.entries(bf.fx).map(([k,v])=>`${k==='atk'?'공격':'방어'} +${v}`).join(' · ')}</span><b id="buffT">${fmtClock(bf.until-now)}</b></div>`:''}
  ${busy?`<div class="card cooking"><div class="crow">${iicon(cur.id,2)}<div style="min-width:0;flex:1"><b>${esc(cur.n)}</b><span class="hint" id="cookT">${done?'완성됐어요!':'조리 중 · '+fmtClock(left)}</span></div></div><div class="bar"><i id="cookB" style="--c:var(--gold);width:${done?100:Math.round((1-left/(cur.sec*1e3))*100)}%"></i></div>${done?`<button class="btn gold sm" data-act="cookdone">꺼내기</button>`:''}</div>`:
  `<div class="rtiles" role="group" aria-label="레시피">${COOK.map(x=>`<button type="button" class="rtile ${canCook(x)?'ok':'no'}" data-act="cooksel" data-k="${x.id}" aria-pressed="${x.id===c.id}" title="${esc(x.n)}" aria-label="${esc(x.n)}">${iicon(x.id,1.5)}</button>`).join('')}</div>
  <div class="card csel"><b>${esc(c.n)}</b><span class="hint">${c.hp>=999?'체력·에너지 완전 회복':`체력 +${c.hp} · 에너지 +${c.en}`}${c.buff?` · ${Object.entries(c.buff).map(([k,v])=>`${k==='atk'?'공격':'방어'} +${v}`).join(' ')} ${c.bmin}분`:''}</span>
   <div class="cneed">${c.need.map(([id,n])=>ingChip(id,n)).join('')}</div>

  ${dishes.length?`<div class="dlist">${dishes.map(x=>`<div class="drow">${iicon(x.id,1)}<span>${esc(x.n)} ×${P.inv[x.id]}</span><button class="btn ghost sm" data-act="use" data-id="${x.id}">먹기</button></div>`).join('')}</div>`:''}`}
function tickCook(){const ck=P.cook;if(P.buff&&Date.now()>=P.buff.until){P.buff=null;log('요리 효과가 사라졌다.','');save();renderPilot();return}const bt=$('#buffT');if(bt&&P.buff)bt.textContent=fmtClock(P.buff.until-Date.now());if(!ck)return;const cur=COOK.find(x=>x.id===ck.id);if(!cur)return;const left=ck.end-Date.now();

const ROOMPICK=[['mon',50],['chest',14],['rest',8],['trap',12],['ev',16]];

  else if(t==='trap'){if(Math.random()<.4){D.msg='바닥의 가시 함정을 아슬아슬하게 피했다.'}else{const d=Math.round(maxHp()*rand(.1,.2)*depthFx(D.floor).mult);heal(-d,0);D.msg=`가시 함정에 걸렸다. 체력 -${d}`;if(P.hp<=0){P.hp=0;dunMsg=`${D.floor}층 함정에 쓰러져 구조 드론에 실려 나왔어요.`;log(dunMsg,'bad');D=null;return}}D.done=true}}

  m.max=m.hp;P.mdex=P.mdex||{};const first=m.sp&&!P.mdex[m.sp];if(m.sp)P.mdex[m.sp]=(P.mdex[m.sp]||0)+1;

$('#joinForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#callsign').value.trim().slice(0,12);if(!v)return;
  if(P.joined&&P.nick!=='새 단원'&&mode==='solo'){P.nick=v}else{P=Object.assign(newPlayer(v),mode==='solo'?{sb:P.sb}:{})}
  if(mode==='online'&&isAdmin)P.owner=1;
  $('#joinModal').hidden=true;log(`콜사인 「${v}」로 개척단에 합류했다.`,'rare');sys(`새 단원 ${v} 님이 정거장에 도착했어요. 환영해 주세요!`);save();renderAll();setPresence()});

/* ───────── bgm ───────── */
const bgm=new Audio('bgm.mp3');bgm.loop=true;bgm.volume=.35;bgm.preload='auto';
let bgmOn=true;try{bgmOn=localStorage.getItem('nebula-bgm')!=='off'}catch(e){}
function syncBgm(){const b=$('#bgmBtn');b.setAttribute('aria-pressed',bgmOn);b.textContent=bgmOn?'♪ BGM 켜짐':'♪ BGM 꺼짐';if(bgmOn){const pr=bgm.play();if(pr&&pr.catch)pr.catch(()=>{})}else bgm.pause()}
$('#suggBtn').innerHTML=img(ENV,null,1)+'건의함';
$('#bgmBtn').addEventListener('click',e=>{e.stopPropagation();bgmOn=!bgmOn;try{localStorage.setItem('nebula-bgm',bgmOn?'on':'off')}catch(_){}syncBgm()});
document.addEventListener('pointerdown',function first(e){if(e.target.closest('#bgmBtn'))return;document.removeEventListener('pointerdown',first,true);if(bgmOn&&bgm.paused)syncBgm()},true);
$('#bgmBtn').textContent=bgmOn?'♪ BGM 켜짐':'♪ BGM 꺼짐';$('#bgmBtn').setAttribute('aria-pressed',bgmOn);

/* ───────── starfield ───────── */
const cv=$('#stars'),cx=cv.getContext('2d');let stars=[];
function sizeStars(){const w=Math.ceil(innerWidth/3),h=Math.ceil(innerHeight/3);cv.width=w;cv.height=h;stars=Array.from({length:Math.round(w*h/420)},()=>({x:ri(0,w),y:ri(0,h),c:['#9ea3b8','#9ea3b8','#7c97a8','#6c6790'][ri(0,3)],b:Math.random()*.7}));drawStars()}
function drawStars(){const w=cv.width,h=cv.height;cx.fillStyle='#06070d';cx.fillRect(0,0,w,h);
  const g=cx.createRadialGradient(w*.72,h*.22,0,w*.72,h*.22,w*.5);g.addColorStop(0,'rgba(95,90,128,.10)');g.addColorStop(1,'rgba(6,7,13,0)');cx.fillStyle=g;cx.fillRect(0,0,w,h);
  stars.forEach(s=>{cx.globalAlpha=.2+s.b*.6;cx.fillStyle=s.c;cx.fillRect(s.x,s.y,1,1)});cx.globalAlpha=1;
  const R=Math.round(Math.min(w,h)*.42),px=Math.round(w*.9),py=Math.round(h+R*.55);for(let y=py-R;y<=h;y++)for(let x=px-R;x<=px+R;x++){const d=Math.hypot(x-px,y-py);if(d>R)continue;cx.fillStyle=d>R-1.5?'#1b2030':(x-px)-(y-py)*.3<-R*.35?'#0a0c14':'#0e111b';cx.fillRect(x,y,1,1)}}
sizeStars();addEventListener('resize',sizeStars);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{for(let i=0;i<3;i++){const s=stars[ri(0,stars.length-1)];if(s)s.b=Math.random()*.7}drawStars()},1400);

/* ───────── loop ───────── */
let wanderAt=0;
setInterval(()=>{if(tab!=='room')return;const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;let mv=!calm&&(Date.now()%240<75);if(!calm&&Date.now()>wanderAt){wanderAt=Date.now()+4000+Math.random()*5000;if(Math.abs(myTX-myRX)<.5){myTX=Math.max(80,Math.min(116,96+(Math.random()*2-1)*14));pushRoomPresence()}}if(Math.abs(myTX-myRX)>.5){myRX+=Math.sign(myTX-myRX)*Math.min(.5,Math.abs(myTX-myRX));mv=true}
  rsPeers.forEach(p=>{const pr=p.presence;if(!pr||!pr.uid||p.isMe)return;const tx=pr.x||96;if(peerX[pr.uid]==null)peerX[pr.uid]=tx;if(Math.abs(tx-peerX[pr.uid])>.5){peerX[pr.uid]+=Math.sign(tx-peerX[pr.uid])*Math.min(1.5,Math.abs(tx-peerX[pr.uid]));mv=true}if(pr.emote&&Date.now()-(pr.ea||0)<3600)mv=true});
  if(myEmote&&Date.now()-myEmote.at<3600)mv=true;else if(myEmote&&Date.now()-myEmote.at>=3600){myEmote=null;pushRoomPresence();mv=true}
  if(mv){drawRoomCv();roomLabels()}},70);
setInterval(()=>{if(tab==='dun'&&dTab==='party'){const b=$('#pAtk');if(b){const cd=Math.max(0,Math.ceil((pCd-Date.now())/100)/10);b.disabled=!!cd;b.textContent=cd?'재정비 '+cd+'초':'공격'}}if(tab==='fish'&&DUEL){const e=$('#duelT');if(e&&duelOn())e.textContent='남은 시간 '+fmtClock(DUEL.end-Date.now());const k='d'+(duelOn()?1:0)+(Date.now()<DUEL.start?1:0);if(k!==window.__dk){window.__dk=k;renderPanel()}}},200);
if(!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{if(tab==='fish'){lakePh+=.18;drawLake()}},160);
addEventListener('resize',()=>{if(tab==='fish')drawLake()});
setInterval(()=>{
  {const sg=sigState(),k='s'+sg.n;if(k!==window.__sk){window.__sk=k;renderNav();if(tab==='scan')renderPanel()}else if(tab==='scan'){const e=$('#sigT');if(e&&sg.n<SIG_MAX)e.textContent='다음 신호까지 '+fmtClock(sg.next)}}
  if(P.faint&&Date.now()>=P.faint)wake();else if(isFaint()){const t1=$('#faintT'),t2=$('#faintT2'),v=fmtClock(P.faint-Date.now());if(t1)t1.textContent=v+' 뒤 깨어나요';if(t2)t2.textContent=v}
  if(mode==='online'&&tab){const anyF=Object.values(PLAYERS).some(p=>p.faint&&Math.abs(Date.now()-p.faint)<1500);if(anyF)renderCrew()}
  tickPilot();
  migrate();const sig=P.field.map(pl=>pl?`${pl.til}${pl.seed||''}${stage(pl)}${isWet(pl)?1:0}`:'_').join();if(sig!==farmSig){farmSig=sig;renderNav();if(tab==='farm')renderPanel()}else if(tab==='farm')P.field.forEach((pl,i)=>{const b=document.querySelector(`[data-prog="${i}"]`);if(b&&pl&&pl.seed)b.style.width=Math.min(100,effG(pl)/ITEMS[pl.seed].grow*100)+'%'});
  {const gx=expInfo(),k=gx?gx.gd+'/'+gx.tg:'';if(k!==window.__gk){window.__gk=k;renderNav();if(tab==='gather')renderPanel()}else if(gx&&tab==='gather'){const l=$('#gLeft'),n=$('#gNext');if(l&&gx.done<gx.total)l.textContent='남은 시간 '+fmtClock(gx.left);if(n)n.textContent='다음 채집까지 '+fmtClock(gx.next)}}
  if(P.ref&&Date.now()>=P.ref){P.water=tankCap();P.refCd=P.ref+3600e3;P.ref=null;log('정수기 충전이 끝났다. 물탱크가 가득 찼다.','good');save();if(tab==='farm')renderPanel()}else if(P.ref&&tab==='farm'){const r=$('#refT');if(r)r.textContent='남은 시간 '+fmtClock(P.ref-Date.now())}else if(P.refCd&&tab==='farm'){const r=$('#refT'),l=P.refCd-Date.now();if(r&&l>0)r.textContent='다시 충전까지 '+fmtClock(l);else if(r&&l<=0){P.refCd=0;renderPanel()}}
  if(tab==='room'&&!visit){const r=$('#restT'),left=(P.restAt||0)+REST_CD-Date.now();if(r&&left>0)r.textContent='다시 쉴 수 있을 때까지 '+fmtClock(left);else if(r&&left<=0&&r.textContent.startsWith('다시'))renderPanel()}
  if(tab==='dun'){const b=$('#strikeBtn');if(b){const cd=Math.max(0,Math.ceil((bossCd-Date.now())/1000));b.disabled=!!cd;const want=cd?`재장전 ${cd}초`:'공격 <small>EN 4</small>';if(b.innerHTML!==want)b.innerHTML=want}}
},1000);

$('#logoIc').innerHTML=img(IC.ship,null,2);$('#joinIc').innerHTML=meImg(4);
renderNet();renderAll();
connect();
})();
</script>
